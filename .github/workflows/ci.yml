name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]
        
    steps:
    # checkout code from GitHub
    - name: Checkout Code
      uses: actions/checkout@v7

    # install system requirements and tools
    - name: Install Build Essentials and Valgrind
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential valgrind cppcheck

    # run static code analysis (linting)
    - name: Run Static Analysic (cppcheck)
      run: |
        cppcheck --enable=all --library=posix --suppress=missingIncludeSystem --error-exitcode=1 src/

    # build the application using the specified matrix compiler
    - name: Compile Code
      run: |
        make clean
        make CC=${{ matrix.compiler }}

    # execute unit test suite
    - name: Run Tests
      run: |
        make clean
        make test

    # memory analysis with valgrind
    - name: Check Memory Leaks with Valgrind
      run: |
        valgrind --leak-check=full --error-exitcode=1 ./build/test_runner
